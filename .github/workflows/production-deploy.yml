name: Production Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_USE_EMULATOR: 'false'
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY_PROD }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN_PROD }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: pmtool-3f8db
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET_PROD }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID_PROD }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_PROD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account credentials
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
        run: python3 -c "import os,json; k=os.environ['SA_KEY']; json.loads(k); open('/tmp/sa.json','w').write(k); print('JSON valid, written to /tmp/sa.json')"

      - name: Authenticate gcloud
        run: gcloud auth activate-service-account --key-file=/tmp/sa.json

      - name: Deploy Firestore + Functions
        run: |
          firebase experiments:enable webframeworks
          firebase deploy --only firestore:rules,firestore:indexes,functions --project pmtool-3f8db --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      - name: Deploy Hosting (with retry)
        run: |
          firebase experiments:enable webframeworks
          firebase deploy --only hosting --project pmtool-3f8db --force || \
          (echo "First attempt failed, retrying in 30s..." && sleep 30 && \
           firebase deploy --only hosting --project pmtool-3f8db --force)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
